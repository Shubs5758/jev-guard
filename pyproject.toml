[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jevguard-middleware"
dynamic = ["version"]
description = "Drop-in guardrails, evaluation and observability middleware for AI agents, powered by TypeSafe's Jev model."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shubham Ambavane", email = "ambavane26@gmail.com" }]
maintainers = [{ name = "Shubham Ambavane", email = "ambavane26@gmail.com" }]
keywords = [
    "ai", "agents", "guardrails", "llm", "security", "prompt-injection",
    "observability", "evaluation", "langchain", "langgraph", "jev", "typesafe",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "PyYAML>=6",
]

[project.optional-dependencies]
dashboard = ["fastapi>=0.110", "uvicorn>=0.29", "sse-starlette>=2"]
langchain = ["langchain>=1.0", "langgraph>=1.0"]
openai-agents = ["openai-agents>=0.2"]
all = ["jevguard-middleware[dashboard,langchain]"]
dev = [
    "jevguard-middleware[dashboard,langchain]",
    "pytest>=8",
    "httpx>=0.27",
    "build>=1.2",
    "twine>=6.1",
]

[project.urls]
Homepage = "https://github.com/Shubs5758/jevguard-middleware"
Repository = "https://github.com/Shubs5758/jevguard-middleware"
Issues = "https://github.com/Shubs5758/jevguard-middleware/issues"
Changelog = "https://github.com/Shubs5758/jevguard-middleware/blob/main/CHANGELOG.md"

[project.scripts]
jevguard = "jevguard.cli:main"

[tool.setuptools.dynamic]
version = { attr = "jevguard.__version__" }

[tool.setuptools.packages.find]
include = ["jevguard*"]

[tool.setuptools.package-data]
jevguard = ["py.typed", "server/static/*", "evals/datasets/*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
